<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" class="flex-house-svg-logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="50%" stop-color="#C8965E" />
      <stop offset="100%" stop-color="#A67238" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBE2DA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g class="logo-emblem" transform="translate(0, 10)">
    <!-- Roof Peak -->
    <path class="roof-line" d="M 172 176 L 255 128 L 325 170 L 332 174" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path class="roof-overhang" d="M 315 164 L 328 172" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Column (F upright) -->
    <path class="col-left" d="M 180 176 L 180 256" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- F Upper Bar -->
    <path class="f-top-bar" d="M 186 182 L 235 182" fill="none" stroke="url(#whiteGrad)" stroke-width="11" stroke-linecap="round" />

    <!-- F Middle Bar -->
    <path class="f-mid-bar" d="M 186 211 L 214 211" fill="none" stroke="url(#whiteGrad)" stroke-width="11" stroke-linecap="round" />

    <!-- Right Column (H upright) -->
    <path class="col-right" d="M 305 137 L 305 256" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Cup Body -->
    <path class="coffee-cup" d="M 224 221 C 224 258, 275 258, 275 221 Z" fill="none" stroke="url(#whiteGrad)" stroke-width="10" stroke-linejoin="round" />

    <!-- Cup Handle -->
    <path class="cup-handle" d="M 273 226 C 291 226, 291 243, 273 243" fill="none" stroke="url(#whiteGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Cup Rim Top Line -->
    <line x1="220" y1="221" x2="279" y2="221" stroke="url(#whiteGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Rising Animated Coffee Steam -->
    <path class="steam-wisp steam-wisp-1" d="M 242 208 C 240 196, 252 188, 246 174 C 243 167, 246 160, 249 156" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <path class="steam-wisp steam-wisp-2" d="M 256 208 C 253 194, 267 186, 260 170 C 257 163, 261 155, 263 151" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g class="logo-text" transform="translate(0, 310)">
    <text x="250" y="20" font-family="'Outfit', 'Montserrat', sans-serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="6" fill="#FFFFFF">
      FLEX HOUSE
    </text>

    <!-- Subtitle: CAFE with lines -->
    <line x1="100" y1="55" x2="178" y2="55" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <text x="250" y="63" font-family="'Outfit', 'Montserrat', sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="12" fill="url(#goldGrad)">
      CAFE
    </text>
    <line x1="322" y1="55" x2="400" y2="55" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
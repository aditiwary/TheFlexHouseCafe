name: Sync Google Maps Reviews

on:
  schedule:
    # Runs automatically once every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime!

# Ensure action has write permission to commit updated reviews.json back to repo
permissions:
  contents: write

jobs:
  sync-google-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Reviews Sync Script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/sync-google-reviews.js

      - name: Commit and Push Updated Reviews
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/reviews.json
          if git diff --staged --quiet; then
            echo "No changes in reviews.json. Everything up to date!"
          else
            git commit -m "chore: auto-sync latest Google Maps reviews [skip ci]"
            git push
            echo "Successfully committed and pushed updated reviews!"
          fi
